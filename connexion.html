<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Se connecter à votre compte OVHcloud.">
    <title>OVHcloud — Se connecter</title>
    <link rel="stylesheet" href="formulaire.css">
</head>
<body>
    <main class="form-page">
        <a class="back-link" href="index.html">Retour à l'accueil</a>

        <section class="form-card" aria-labelledby="connexion-title">
            <a class="form-logo" href="index.html">
                <img src="logo.png" alt="Logo du groupe 14">
                <span>OVHCLOUD</span>
            </a>
            <h1 id="connexion-title">Se connecter</h1>
            <p class="form-intro">Accédez à votre espace personnel.</p>

            <form action="#" method="post">
                <div class="field-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="field-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

               <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        Se souvenir de moi
                    </label>
                </div>

                <button type="submit" class="form-button">Se connecter</button>
            </form>

            <p class="form-footer">Vous n'avez pas de compte ? <a href="inscription.html">Créer un compte</a></p>
        </section>
    </main>
</body>
</html>
