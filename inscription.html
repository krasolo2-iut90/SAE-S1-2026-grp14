<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créer un compte OVHcloud.">
    <title>OVHcloud — S'inscrire</title>
    <link rel="stylesheet" href="formulaire.css">
</head>
<body>
    <main class="form-page">
        <a class="back-link" href="index.html">← Retour à l'accueil</a>

        <section class="form-card" aria-labelledby="inscription-title">
            <a class="form-logo" href="index.html">
                <img src="logo.png" alt="Logo du groupe 14">
            </a>
            <h1 id="inscription-title">Créer un compte</h1>
            <p class="form-intro">Rejoignez-nous en quelques secondes.</p>

            <form action="#" method="post">
                <div class="field-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <div class="field-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="field-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
                    <small>Le mot de passe doit contenir au moins 8 caractères.</small>
                </div>

                <div class="field-group">
                    <label for="password-confirmation">Confirmer le mot de passe</label>
                    <input type="password" id="password-confirmation" name="password-confirmation" minlength="8" autocomplete="new-password" required>
                </div>

                <button type="submit" class="form-button">S'inscrire</button>
            </form>

            <p class="form-footer">Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
        </section>
    </main>
</body>
</html>
